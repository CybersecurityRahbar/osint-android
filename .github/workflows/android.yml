name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
      PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
      PREVIEW_KEY_ALIAS: osint-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM acceleration is available."
            else
              echo "::warning::/dev/kvm exists but is not accessible; emulator may boot slowly."
            fi
          else
            echo "::warning::/dev/kvm is unavailable on this runner; emulator hardware acceleration may be unavailable."
          fi

      - name: Run Android runtime parser tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Upload Android test reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare stable preview signing
        if: ${{ env.PREVIEW_KEYSTORE_BASE64 != '' && env.PREVIEW_KEYSTORE_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/osint-workbench-preview.p12"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_FILE" \
            -storepass "$PREVIEW_KEYSTORE_PASSWORD" -alias "$PREVIEW_KEY_ALIAS" >/dev/null
          echo "PREVIEW_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Stable preview signing key is configured."

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload stable-signed preview APK
        if: ${{ env.PREVIEW_KEYSTORE_BASE64 != '' && env.PREVIEW_KEYSTORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: osint-workbench-v0.12.1-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain APK download and installation
        if: ${{ success() && env.PREVIEW_KEYSTORE_BASE64 != '' && env.PREVIEW_KEYSTORE_PASSWORD != '' }}
        run: |
          {
            echo "## OSINT Workbench v0.12.1 preview"
            echo ""
            echo "- Artifact: `osint-workbench-v0.12.1-preview-apk` (ZIP containing `app-debug.apk`)."
            echo "- Preview application ID: `com.cyberphantom.osintworkbench.preview051`."
            echo "- This preview is signed with the stable `osint-preview` key. Keep the two signing secrets unchanged for every future update."
            echo "- The earlier `.preview050` app remains installed alongside this transition build; because that older APK was signed with an ephemeral key, its session cannot be transferred by an in-place update."
            echo "- CI verifies unit tests and packaging, but private-source session automation must still be tested on the actual phone."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain stable signing setup is required for downloadable updates
        if: ${{ success() && (env.PREVIEW_KEYSTORE_BASE64 == '' || env.PREVIEW_KEYSTORE_PASSWORD == '') }}
        run: |
          {
            echo "## Tests passed; stable APK artifact not published"
            echo ""
            echo "Add repository Actions secrets PREVIEW_KEYSTORE_BASE64 and PREVIEW_KEYSTORE_PASSWORD, then run this workflow again."
            echo "The APK was built with a temporary debug key only to check compilation; it was intentionally not uploaded so it cannot be mistaken for an updateable release."
          } >> "$GITHUB_STEP_SUMMARY"
